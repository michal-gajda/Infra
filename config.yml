extensions:
  health_check:

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlphttp:
    endpoint: http://seq:5341/ingest/otlp
    tls:
      insecure: true
  otlphttp/openobserve:
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: Basic cm9vdEBleGFtcGxlLmNvbTpQQHNzdzByZA==
  prometheus:
    endpoint: 0.0.0.0:8889

service:

  pipelines:

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp, otlphttp/openobserve]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, otlphttp/openobserve]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp, otlphttp/openobserve]

  extensions: [health_check]
